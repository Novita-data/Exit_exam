<!DOCTYPE html>
<html>
<head>
    <title>ML Prediction App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; }
        .container { max-width: 450px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 8px; margin: 8px 0 16px 0; box-sizing: border-box; }
        button { width: 100%; background-color: #008080; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #006666; }
        h3 { color: #333; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Data Science Model Prediction</h2>
        <form method="POST">
            <label>Feature 1:</label>
            <input type="number" step="any" name="feature1" required>

            <label>Feature 2:</label>
            <input type="number" step="any" name="feature2" required>

            <label>Category:</label>
            <select name="category_col">
                <option value="OptionA">Option A</option>
                <option value="OptionB">Option B</option>
            </select>

            <button type="submit">Predict</button>
        </form>
        {% if prediction %}
            <h3>{{ prediction }}</h3>
        {% endif %}
    </div>
</body>
</html>
